name: Probe Volga official level feeds
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe-volga.yml
      - scripts/probe-volga.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Excel reader for official XLS
        run: pip install xlrd==2.0.2
      - name: Test source connectivity and inspect bulletin contents
        run: python scripts/probe-volga.py
      - name: Save diagnostics to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/volga-source-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official Volga source diagnostic [skip ci]'
            git pull --rebase
            git push
          fi
