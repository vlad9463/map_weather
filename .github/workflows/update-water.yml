name: Update Volga water conditions
on:
  schedule:
    - cron: '20 3,9,15 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-water.yml
      - scripts/update-water.cjs
permissions:
  contents: write
concurrency:
  group: rybtochki-hydrology
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Get levels and water temperature outlook
        run: node scripts/update-water.cjs
      - name: Update public JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/volga-samara.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh water readings [skip ci]'
            git push
          fi
