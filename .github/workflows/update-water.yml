name: Update Volga water conditions
on:
  schedule:
    - cron: '20 3,9,15 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/update-water.yml
      - scripts/update-water.cjs
      - scripts/update-official-water.py
permissions:
  contents: write
concurrency:
  group: rybtochki-hydrology
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLS reader
        run: pip install xlrd==2.0.2
      - name: Update regional water temperature
        run: node scripts/update-water.cjs
      - name: Download official Samara Volga daily level bulletins
        run: python scripts/update-official-water.py
      - name: Publish only verified dated measurements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/volga-samara.json data/volga-level-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official Volga Samara hydrology [skip ci]'
            git pull --rebase
            git push
          fi
